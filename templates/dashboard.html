```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Breeze Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #9ca3af;
        }

        .container {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .unit {
            font-size: 15px;
            color: #6b7280;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .status {
            margin-top: 20px;
            color: #16a34a;
            font-weight: bold;
        }

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>⚡ SMART BREEZE</h1>

    <p>
        Smart Energy Monitoring System
    </p>

</header>


<div class="container">


    <!-- ENERGY CARDS -->

    <div class="cards">


        <div class="card">

            <h3>Voltage</h3>

            <div class="value" id="voltage">
                --
            </div>

            <div class="unit">
                Volts
            </div>

        </div>


        <div class="card">

            <h3>Current</h3>

            <div class="value" id="current">
                --
            </div>

            <div class="unit">
                Amps
            </div>

        </div>


        <div class="card">

            <h3>Power</h3>

            <div class="value" id="power">
                --
            </div>

            <div class="unit">
                Watts
            </div>

        </div>


        <div class="card">

            <h3>Energy</h3>

            <div class="value" id="energy">
                --
            </div>

            <div class="unit">
                kWh
            </div>

        </div>


    </div>


    <!-- POWER CHART -->

    <div class="chart-container">

        <h2>
            Power Consumption
        </h2>

        <canvas id="powerChart"></canvas>

        <div class="status" id="status">
            Connecting...
        </div>

    </div>


</div>


<script>


let powerChart;


// ==========================================
// CREATE CHART
// ==========================================

function createChart() {

    const ctx = document
        .getElementById("powerChart")
        .getContext("2d");


    powerChart = new Chart(ctx, {

        type: "line",

        data: {

            labels: [],

            datasets: [{

                label: "Power (W)",

                data: [],

                borderWidth: 2,

                tension: 0.3

            }]

        },


        options: {

            responsive: true,

            animation: false,

            scales: {

                y: {

                    beginAtZero: true

                }

            }

        }

    });

}


// ==========================================
// LOAD LATEST READING
// ==========================================

async function loadLatest() {

    try {

        const response = await fetch(
            "/latest",
            {
                cache: "no-store"
            }
        );


        const result = await response.json();


        if (result.status !== "success") {

            throw new Error(
                "Server returned an error"
            );

        }


        const latest = result.data;


        if (!latest) {

            document.getElementById("status").innerText =
                "Waiting for ESP32 data...";

            return;

        }


        // Update cards

        document.getElementById("voltage").innerText =
            latest.voltage ?? "--";


        document.getElementById("current").innerText =
            latest.current ?? "--";


        document.getElementById("power").innerText =
            latest.power ?? "--";


        document.getElementById("energy").innerText =
            latest.energy ?? "--";


        document.getElementById("status").innerText =
            "● Connected — Last update: " +
            new Date(latest.created_at)
                .toLocaleString();


    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Connection error";

    }

}


// ==========================================
// LOAD CHART DATA
// ==========================================

async function loadChart() {

    try {

        const response = await fetch(
            "/energy",
            {
                cache: "no-store"
            }
        );


        const result = await response.json();


        if (result.status !== "success") {

            throw new Error(
                "Server returned an error"
            );

        }


        const data = result.data;


        if (!data || data.length === 0) {

            return;

        }


        // Oldest → newest

        const chartData = [...data].reverse();


        powerChart.data.labels =
            chartData.map(item => {

                const date =
                    new Date(item.created_at);

                return date.toLocaleTimeString();

            });


        powerChart.data.datasets[0].data =
            chartData.map(item => item.power);


        powerChart.update();

    }

    catch (error) {

        console.error(
            "Chart error:",
            error
        );

    }

}


// ==========================================
// START
// ==========================================

createChart();


// Load immediately

loadLatest();

loadChart();


// Latest reading every 2 seconds

setInterval(
    loadLatest,
    2000
);


// Chart every 10 seconds

setInterval(
    loadChart,
    10000
);


</script>


</body>

</html>
