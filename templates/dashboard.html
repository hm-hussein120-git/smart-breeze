<script>


/* ==========================================
   CHART
========================================== */

let powerChart;


/* ==========================================
   CREATE CHART
========================================== */

function createChart() {

    const ctx =
        document
        .getElementById("powerChart")
        .getContext("2d");


    powerChart = new Chart(ctx, {

        type: "line",

        data: {

            labels: [],

            datasets: [

                {

                    label: "Power (W)",

                    data: [],

                    borderWidth: 2,

                    tension: 0.3,

                    fill: false

                }

            ]

        },


        options: {

            responsive: true,

            animation: false,

            scales: {

                y: {

                    beginAtZero: true

                }

            }

        }

    });

}



/* ==========================================
   LOAD LATEST DATA
========================================== */

async function loadLatest() {

    try {

        const response =
            await fetch("/latest", {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        if (result.status !== "success") {

            throw new Error(
                "Server returned an error"
            );

        }


        const latest =
            result.data;


        /* =========================
           NO DATA
        ========================= */

        if (!latest) {

            document
                .getElementById("status")
                .innerText =
                "Waiting for ESP32 data...";

            document
                .getElementById("status")
                .className =
                "status waiting";

            return;

        }


        /* =========================
           UPDATE CARDS
        ========================= */

        document
            .getElementById("voltage")
            .innerText =
            latest.voltage ?? "--";


        document
            .getElementById("current")
            .innerText =
            latest.current ?? "--";


        document
            .getElementById("power")
            .innerText =
            latest.power ?? "--";


        document
            .getElementById("energy")
            .innerText =
            latest.energy ?? "--";


        /* =========================
           UPDATE STATUS
        ========================= */

        const date =
            new Date(latest.created_at);


        document
            .getElementById("status")
            .innerText =
            "● Connected — Last update: " +
            date.toLocaleString();


        document
            .getElementById("status")
            .className =
            "status connected";


    }


    catch (error) {

        console.error(
            "Latest data error:",
            error
        );


        document
            .getElementById("status")
            .innerText =
            "● Connection error";


        document
            .getElementById("status")
            .className =
            "status error";

    }

}



/* ==========================================
   LOAD CHART DATA
========================================== */

async function loadChart() {

    try {

        const response =
            await fetch("/energy", {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const result =
            await response.json();


        if (result.status !== "success") {

            throw new Error(
                "Server returned an error"
            );

        }


        const data =
            result.data;


        if (!data || data.length === 0) {

            return;

        }


        /* =========================
           OLD → NEW
        ========================= */

        const chartData =
            [...data].reverse();


        /* =========================
           TIME LABELS
        ========================= */

        powerChart.data.labels =
            chartData.map(item => {

                const date =
                    new Date(item.created_at);

                return date.toLocaleTimeString();

            });


        /* =========================
           POWER VALUES
        ========================= */

        powerChart.data.datasets[0].data =
            chartData.map(item => item.power);


        powerChart.update();

    }


    catch (error) {

        console.error(
            "Chart error:",
            error
        );

    }

}



/* ==========================================
   INITIALIZE
========================================== */

createChart();

loadLatest();

loadChart();



/* ==========================================
   AUTO REFRESH
========================================== */

setInterval(() => {

    loadLatest();

    loadChart();

}, 5000);


</script>
